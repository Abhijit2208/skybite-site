<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyBite: passenger and crew</title>
<style>

html{color-scheme:light;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body::before{content:"";position:fixed;left:-5%;right:-5%;bottom:-64px;height:120px;z-index:-1;pointer-events:none;background:linear-gradient(90deg,var(--a2),var(--a3),var(--a1),var(--a2),var(--a3));background-size:200% 100%;filter:blur(34px);animation:slide 20s linear infinite}
@keyframes slide{to{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:auto;padding:16px}
h1{font:700 28px/1.15 Georgia,"Times New Roman",serif;margin:0;color:var(--ink)}
h2{font:700 16px/1.3 system-ui,sans-serif;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.mu{color:var(--mu);font-size:13px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:14px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px}
label{display:block;margin:6px 0;cursor:pointer}
select,input[type=text]{width:100%;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.b{border:0;background:var(--tu);color:#1a1300;font:700 14px system-ui;padding:9px 13px;border-radius:8px;cursor:pointer}
.b.s{background:transparent;border:1px solid var(--bd);color:var(--tx);font-weight:600;padding:6px 10px}
.b[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--tu);outline-offset:2px}
.roles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:20px}
.roles button{text-align:left;background:var(--cd);color:var(--tx);border:2px solid var(--ink);border-radius:12px;padding:18px;font:inherit;cursor:pointer}
.roles b{display:block;font:700 20px Georgia,serif;color:var(--ink);margin-bottom:4px}
.m{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--cd)}
.m.x{opacity:.65}
.m h3{margin:0 0 2px;font-size:15px}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}
.tk{border:2px dashed var(--ink);border-radius:12px;padding:12px;background:var(--tint);margin-top:10px}
.tag{display:inline-block;background:var(--ink);color:var(--onink);font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.o{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--cd)}
.o.n{border:2px solid var(--tu);background:var(--tint)}
.row{display:flex;justify-content:space-between;gap:8px}
.ban{background:var(--tint);border:1px solid var(--tu);border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px}
.ch{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;max-height:240px;overflow-y:auto;margin-bottom:8px}
.bb{margin:6px 0;padding:8px 10px;border-radius:10px;max-width:92%;font-size:14px}
.bb.b{background:var(--tint);border:1px solid var(--tu)}.bb.u{background:var(--ink);color:var(--onink);margin-left:auto}
.chip{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:999px;padding:4px 10px;margin:3px 3px 0 0;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.bar{position:sticky;bottom:0;background:var(--cd);border:2px solid var(--ink);border-radius:10px;padding:10px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px;border-bottom:1px solid var(--bd);vertical-align:top}.wrap{overflow-x:auto}td input{min-width:170px}
details{margin-top:4px}summary{cursor:pointer;color:var(--mu);font-size:13px}
/* JAL Breakthrough Ideas Spotlight */

.ideas-title{font:700 24px/1.2 Georgia,serif;color:var(--ink);margin:0 0 6px}
.ideas-sub{color:var(--mu);font-size:14px;margin:0 0 16px;max-width:72ch;line-height:1.5}
.ideas-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.idea-card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;transition:transform .15s ease,box-shadow .15s ease}
.idea-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.idea-card.c1{border-top:3.5px solid #e7a100;background:linear-gradient(180deg,rgba(231,161,0,0.05) 0%,var(--cd) 100%)}
.idea-card.c2{border-top:3.5px solid #0f766e;background:linear-gradient(180deg,rgba(15,118,110,0.05) 0%,var(--cd) 100%)}
.idea-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
.idea-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:0.03em}
.idea-card.c1 .idea-tag{background:var(--tint);color:#8a5800;border:1px solid var(--tu)}
.idea-card.c2 .idea-tag{background:#e6f7f5;color:#0f766e;border:1px solid #14b8a6}
:root[data-theme="dark"] .idea-card.c2 .idea-tag{background:#0e2826;color:#5eead4;border-color:#0f766e}
.idea-h{font:700 17px/1.25 Georgia,serif;color:var(--ink);margin:0}
.idea-sec{font-size:13.5px;line-height:1.5}
.idea-lbl{font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;display:flex;align-items:center;gap:5px;margin-bottom:3px}
.idea-card.c1 .idea-lbl{color:#b45309}
.idea-card.c2 .idea-lbl{color:#0f766e}
:root[data-theme="dark"] .idea-card.c1 .idea-lbl{color:#f59e0b}
:root[data-theme="dark"] .idea-card.c2 .idea-lbl{color:#2dd4bf}
.idea-box{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.5}
.idea-win{border-left:3px solid var(--ok);background:rgba(23,112,63,0.06);border-radius:0 8px 8px 0;padding:9px 12px;font-size:13px;line-height:1.5}
.idea-card.c1 .idea-win{border-left-color:#e7a100;background:rgba(231,161,0,0.08)}
.idea-card.c2 .idea-win{border-left-color:#0f766e;background:rgba(15,118,110,0.08)}
.idea-steps{display:grid;gap:6px;margin-top:4px}
.idea-step{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45}
.idea-num{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.idea-card.c1 .idea-num{background:#e7a100;color:#1a1300}
.idea-card.c2 .idea-num{background:#0f766e;color:#fff}
.idea-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
/* Modal for viewing ideas anywhere */
.modal-wrap{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,15,20,0.65);backdrop-filter:blur(5px);z-index:9999;display:none;align-items:center;justify-content:center;padding:16px}
.modal-wrap.open{display:flex}
.modal-body{background:var(--bg);color:var(--tx);border:2px solid var(--ink);border-radius:14px;max-width:880px;width:100%;max-height:90vh;overflow-y:auto;padding:22px;box-shadow:0 16px 48px rgba(0,0,0,0.25)}
</style></head><body><div class="w" id="app"></div><div id="modal-host"></div>
<script>
const $=id=>document.getElementById(id),app=$('app');
const C=[
{id:'pan',n:'Paneer butter masala + jeera rice',f:['grain','onion_garlic'],al:['dairy','tree_nut'],q:40,k:[640,22,70],i:'Paneer, butter, cream, tomato, onion, garlic, cashew paste, spices, basmati rice, cumin'},
{id:'chk',n:'Chicken curry + rice',f:['meat','grain','onion_garlic','high_sodium'],al:[],q:40,k:[680,34,68],i:'Chicken, onion, garlic, ginger, tomato, coriander, garam masala, basmati rice, salt'},
{id:'jdl',n:'Jain dal + steamed rice',f:['grain','pulse'],al:['dairy'],q:4,k:[480,17,78],i:'Toor dal, ghee, cumin, asafoetida, tomato, turmeric, steamed rice (no onion, garlic or root vegetables)'},
{id:'bir',n:'Halal chicken biryani',f:['meat','grain','onion_garlic','high_sodium'],hal:1,al:['dairy'],q:4,k:[720,36,82],i:'Halal chicken, basmati rice, yogurt, onion, garlic, ginger, mint, saffron, ghee, spices, salt'},
{id:'mil',n:'Millet upma with vegetables',f:['grain'],al:['mustard'],q:5,k:[380,11,60],i:'Foxtail millet, carrot, beans, peas, mustard seeds, curry leaves, ginger, green chilli, sunflower oil, salt'},
{id:'sab',n:'Sabudana khichdi (vrat)',f:['root_veg'],al:['peanut','dairy'],q:3,k:[450,8,70],i:'Sabudana (tapioca pearls), roasted peanuts, potato, cumin, green chilli, ghee, rock salt'},
{id:'frt',n:'Fruit and makhana bowl (premium)',f:[],al:[],q:3,k:[260,6,48],i:'Papaya, pomegranate, apple, roasted makhana (fox nuts), lemon, rock salt'},
{id:'kic',n:'Millet-moong khichdi with ghee (premium)',f:['grain','pulse'],al:['dairy'],q:3,k:[520,16,70],i:'Millet, split moong dal, ghee, cumin, ginger, turmeric, carrot'}];
const FL={jain:'Jain',sattvic:'Sattvic or Swaminarayan (no onion, garlic)',vrat:'Fasting meal (vrat)',halal:'Halal',diabetic:'Diabetic-friendly',low_sodium:'Low sodium'};
const AL={peanut:'Peanut',tree_nut:'Tree nuts',dairy:'Dairy',egg:'Egg',gluten:'Gluten',soy:'Soy',sesame:'Sesame',fish:'Fish',shellfish:'Shellfish',mustard:'Mustard'};
const BASE={veg:'Vegetarian',egg:'Eggetarian',nonveg:'Non-vegetarian'};
const OCC=['Navratri','Diwali','Eid','Christmas','Birthday','Anniversary','Other'];
const S0=[
{id:'x1',n:'Navratri vrat thali',occ:'Navratri',f:['root_veg'],al:['dairy','peanut'],q:6,k:[520,12,78],i:'Sabudana khichdi, kuttu (buckwheat) puri, potato sabzi, samak rice, curd, rock salt'},
{id:'x2',n:'Diwali mithai and snack box',occ:'Diwali',f:['grain','added_sugar'],al:['dairy','tree_nut','gluten'],q:6,k:[480,9,62],i:'Kaju katli, besan ladoo, soan papdi, baked namkeen, raisins, almonds'},
{id:'x3',n:'Eid biryani with sheer khurma',occ:'Eid',f:['meat','grain','onion_garlic','added_sugar','high_sodium'],hal:1,al:['dairy','tree_nut'],q:6,k:[820,34,98],i:'Halal mutton biryani, raita, sheer khurma (vermicelli, milk, dates, almonds, sugar)'},
{id:'x4',n:'Christmas roast chicken and plum cake',occ:'Christmas',f:['meat','egg','grain','added_sugar','root_veg'],al:['egg','gluten','tree_nut','dairy'],q:6,k:[760,38,80],i:'Herb roast chicken, roast carrot and potato, plum cake (flour, eggs, butter, dried fruit, cashew, sugar)'},
{id:'x5',n:'Birthday cake slice',occ:'Birthday',f:['egg','grain','added_sugar'],al:['egg','gluten','dairy'],q:8,k:[380,5,52],i:'Sponge cake (flour, eggs, sugar, butter), cream frosting, strawberry'},
{id:'x6',n:'Eggless birthday cake slice',occ:'Birthday',f:['grain','added_sugar'],al:['gluten','dairy'],q:8,k:[360,5,54],i:'Eggless sponge (flour, yogurt, sugar, butter), cream frosting, strawberry'},
{id:'x7',n:'Anniversary rasmalai plate',occ:'Anniversary',f:['added_sugar'],al:['dairy','tree_nut'],q:4,k:[340,6,44],i:'Rasmalai (milk, paneer, sugar, cardamom, pistachio), fresh strawberries'}];
C.push(...S0);
let occ='All',sp=[],rs={},rq=[],seen=null,note=null,hrs=24,ex=[];
const route=x=>x>=18?'caterer':x>=1?'lounge':'cabin';
const iso=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const CAL0={Navratri:[['2026-10-11','2026-10-19']],Diwali:[['2026-11-06','2026-11-10']],Eid:[['2027-03-08','2027-03-11'],['2027-05-15','2027-05-18']],Christmas:[['2026-12-23','2026-12-26'],['2027-12-23','2027-12-26']]};
let cal=JSON.parse(JSON.stringify(CAL0)),tdate=iso(),ed=null;
const ALW=['Birthday','Anniversary','Other'];
const okd=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T00:00:00'));
const shift=(s,n)=>{const t=new Date(s+'T00:00:00');t.setDate(t.getDate()+n);return iso(t)};
const inSeason=(o,dt)=>(cal[o]||[]).some(w=>dt>=shift(w[0],-1)&&dt<=w[1]);
const avail=(d,dt)=>!d.occ||ALW.includes(d.occ)||inSeason(d.occ,dt);
const nextOpen=(o,t)=>(cal[o]||[]).map(w=>shift(w[0],-1)).filter(s=>s>t).sort()[0];
const wText=o=>(cal[o]||[]).map(w=>w[0]+'..'+w[1]).join('; ');
function parseW(t){return String(t).split(';').map(x=>x.trim().split('..').map(y=>y.trim())).filter(w=>w.length==2&&okd(w[0])&&okd(w[1])&&w[0]<=w[1])}
const fmt=s=>new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const occRows=edit=>{const src=edit?ed:cal;let r='';
for(const o of [...Object.keys(CAL0),...ALW]){const ms=C.filter(d=>d.occ==o).map(d=>esc(d.n)).join('<br>')||'<span class="mu">None yet</span>';
if(ALW.includes(o)){r+=`<tr><td><b>${o}</b></td><td colspan="2">Always available</td><td>${ms}</td><td class="ok">Available</td></tr>`;continue}
const w=src[o]||[];
(w.length?w:[null]).forEach((x,i)=>{const act=x&&tdate>=shift(x[0],-1)&&tdate<=x[1];
r+=`<tr>${i==0?`<td rowspan="${w.length||1}"><b>${o}</b>${edit?`<br><button class="b s" data-add="${o}">Add period</button>`:''}</td>`:''}<td>${!x?'<span class="mu">Not set</span>':edit?`<input type="date" data-o="${o}" data-i="${i}" data-k="0" value="${x[0]}">`:fmt(x[0])}</td><td>${!x?'':edit?`<input type="date" data-o="${o}" data-i="${i}" data-k="1" value="${x[1]}">`:fmt(x[1])}</td>${i==0?`<td rowspan="${w.length||1}">${ms}</td>`:''}<td class="${act?'ok':'mu'}">${!x?'':act?'Available':'Not on this date'}${edit&&x?` <button class="b s" data-rm="${o}:${i}">Remove</button>`:''}</td></tr>`})}
return '<div class="wrap"><table><tr><th>Occasion</th><th>Start date</th><th>End date</th><th>Meals</th><th>On '+tdate+'</th></tr>'+r+'</table></div>'};
const seasonMsg=()=>{const a=Object.keys(cal).filter(o=>inSeason(o,tdate)),n=Object.keys(cal).map(o=>[o,nextOpen(o,tdate)]).filter(x=>x[1]).sort((p,q)=>p[1]<q[1]?-1:1)[0];
return (a.length?'Festival meals on your travel date: '+a.join(', ')+'.':'No festival meals on this date.')+(n?' Next: '+n[0]+' meals open on '+n[1]+'.':'')+' Birthday and anniversary meals are always available.'};
const cl=s=>String(s==null?'':s).replace(/[<>&"]/g,'');
function setSpecials(l){for(let i=C.length-1;i>=0;i--)if(C[i].sp)C.splice(i,1);
l.forEach(d=>{if(d&&d.id&&Array.isArray(d.f)&&Array.isArray(d.al)&&Array.isArray(d.k))C.push({id:cl(d.id),n:cl(d.n).slice(0,60),occ:OCC.includes(d.occ)?d.occ:'Other',f:d.f.map(cl),al:d.al.filter(a=>AL[a]),hal:d.hal?1:0,q:Math.max(0,Math.min(500,+d.q||0)),k:[+d.k[0]||0,+d.k[1]||0,+d.k[2]||0],i:cl(d.i).slice(0,300),sp:1})})}
function check(p,d){const f=new Set(d.f),h=x=>f.has(x),w=[];
if(p.base=='veg'&&(h('meat')||h('fish')||h('egg')))w.push('not vegetarian');
if(p.base=='egg'&&(h('meat')||h('fish')))w.push('contains meat');
if(p.jain&&(h('meat')||h('onion_garlic')||h('root_veg')))w.push('not Jain');
if((p.sattvic||p.vrat)&&h('onion_garlic'))w.push('has onion or garlic');
if(p.vrat&&(h('grain')||h('pulse')||h('meat')))w.push('not vrat-compliant');
if(p.halal&&h('meat')&&!d.hal)w.push('not halal-certified');
if(p.diabetic&&d.k[2]>75)w.push('high carbohydrate load');
if(p.diabetic&&h('added_sugar'))w.push('added sugar');
if(p.low_sodium&&h('high_sodium'))w.push('high sodium');
for(const a in p.al)if(p.al[a]&&d.al.includes(a))w.push('contains '+AL[a].toLowerCase());
return w}
const need=p=>BASE[p.base]+Object.keys(FL).filter(k=>p[k]).map(k=>', '+FL[k].split(' (')[0]).join('')+Object.keys(p.al||{}).filter(a=>p.al[a]).map(a=>', allergy: '+AL[a].toLowerCase()).join('');
let db=null,orders=[],role=null,myId=null,P={base:'veg',al:{},other:[]},seat='14C',local=false,sel=[],ai=null;
const chat=[{r:'b',t:'Hi, I am SkyBite, your meal assistant. Tell me about any allergies or food rules (for example "peanut and egg allergy, Jain") and I will find meals that fit.'}];
Object.keys(FL).forEach(k=>P[k]=false);

const fits=()=>C.filter(d=>!check(P,d).length&&(left(d)>0||route(hrs)=='lounge'));

function banner(t){const b=$('ban');if(b){b.style.display='block';b.textContent=t}}
const ideasHtml=(isModal=false)=>`
<div class="ideas-hero"${isModal?' style="margin:0;box-shadow:none;border:none;padding:0"':''}>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">

      <div class="ideas-badge">Strategic Innovations • JAL Dietary Intelligence</div>
      <h2 class="ideas-title" style="font-size:${isModal?'22px':'24px'}">Dynamic In-Flight Hospitality &amp; Waste Reduction</h2>
      <p class="ideas-sub">Solving the two biggest bottlenecks in airline catering: rigid last-minute dietary fulfillment and cabin food waste, without requiring additional food buffers.</p>
    </div>
    ${isModal?'<button class="b s" id="close-modal" style="font-size:16px;padding:4px 12px;cursor:pointer">✕ Close</button>':''}
  </div>

  <div class="ideas-grid">
    <!-- Idea 1 Card -->
    <div class="idea-card c1">
      <div class="idea-header">
        <h3 class="idea-h">Idea 1: JAL "Lounge-to-Cabin" Sync</h3>
